---
# Configuration for golangci-lint. See https://golangci-lint.run/docs/configuration/file/
# for all available options and their defaults.
version: "2"
# options for analysis running
run:
  # analyze dependencies from the vendor/ directory rather than downloading them
  modules-download-mode: vendor

  # exit code when at least one issue was found, default is 1
  issues-exit-code: 1

  # include test files or not, default is true
  tests: true
# output configuration options
output:
  # the formats used to render issues
  # output path can be either `stdout`, `stderr`
  # or path to the file to write to
  formats:
    text:
      path: stdout
      # print linter name in the end of issue text, default is true
      print-linter-name: true
      # print lines of code with issue, default is true
      print-issued-lines: true
linters:
  # `default: standard` (the default) additionally enables errcheck, govet,
  # ineffassign, staticcheck and unused, so they are deliberately not listed here.
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - goconst
    - gocritic
    - gocyclo
    - misspell
    - nakedret
    - revive
    - unconvert
    - unparam
  settings:
    goconst:
      # Table-driven tests repeat literals by nature; hoisting them into
      # constants hurts readability more than it helps.
      ignore-tests: true
    gocritic:
      enabled-tags: [performance, opinionated, diagnostic]
      disabled-checks: [paramTypeCombine, unnamedResult, unnecessaryDefer]
      settings:  # settings passed to gocritic
        hugeParam:
          sizeThreshold: 512
        rangeValCopy:
          sizeThreshold: 512
          skipTestFuncs: true
    govet:
      disable-all: false
      enable-all: true
      disable:
        # extremely noisy, also against common Go style in most cases
        - shadow
    staticcheck:
      # This repeats the upstream default list, plus QF1008. Overriding `checks`
      # replaces the default wholesale, so the defaults must be restated.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # QF1008 wants embedded fields dropped from selectors, e.g.
        # `gs.ObjectMeta.Name` -> `gs.Name`. Naming the embedded struct is the
        # Kubernetes convention and is load-bearing for readability in pkg/apis.
        - -QF1008
        # QF1001 wants De Morgan's law applied. The controllers deliberately
        # write guards as a negated positive precondition, e.g.
        # `if !(state == Creating && DeletionTimestamp.IsZero())`, which states
        # the condition being guarded for directly. Distributing the negation
        # turns it into an `||` of two negations and reads worse.
        - -QF1001
  exclusions:
    # `lax` matches the generated-file detection golangci-lint v1 used. `strict`
    # only honours the canonical `// Code generated ... DO NOT EDIT.` line.
    generated: lax

    # Warn when an exclusion below stops matching anything, so these do not
    # silently rot the way the old `examples$` directory exclusion did.
    warn-unused: true
    rules:
      # Skip fieldalignment checks on:
      # - tests: memory footprint doesn't matter
      # - cmd/: we assume these are one-off config entries
      # - pkg/apis: Keep strong convention on TypeMeta/ObjectMeta/Spec/Status
      - path: (.+)_test\.go|^test/|^cmd/.*|^pkg/apis/.*
        # fieldalignment is in the `govet` linter, so exclude based on text instead of all of govet
        text: '^fieldalignment: .*'

    # which file paths to exclude: issues from them won't be reported
    paths:
      - test/sdk/restapi
issues:
  # Report every occurrence. The defaults (50 per linter, 3 per identical message)
  # hide issues until earlier ones are fixed, which makes the true backlog invisible.
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - test/sdk/restapi
